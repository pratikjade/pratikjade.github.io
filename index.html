  <meta property="og:title" content="Pratik Jade — AI/ML Engineer">

  <style>
    .jp-cloud {
      animation: cloudDrift 16s ease-in-out infinite alternate
    }

    @keyframes cloudDrift {
      from {
        transform: translateX(-18px)
      }

      to {
        transform: translateX(22px)
      }
    }

    .jp-bob {
      animation: bob 4s ease-in-out infinite
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-5px)
      }
    }

    .jp-mist {
      animation: cloudDrift 11s ease-in-out infinite alternate
    }

    @media (prefers-reduced-motion: reduce) {

      .jp-cloud,
      .jp-bob,
      .jp-mist {
        animation: none !important
      }
    }

    .petal {
      position: absolute;
      top: -30px;
      width: 14px;
      height: 10px;
      border-radius: 14px 0 14px 0;
      background: #E7B9B0;
      opacity: .85;
      pointer-events: none;
      animation: petalFall 14s linear infinite
    }

    @keyframes petalFall {
      0% {
        transform: translate(0, 0) rotate(0)
      }

      25% {
        transform: translate(40px, 200px) rotate(120deg)
      }

      50% {
        transform: translate(-20px, 420px) rotate(220deg)
      }

      75% {
        transform: translate(50px, 640px) rotate(320deg)
      }

      100% {
        transform: translate(0, 880px) rotate(420deg);
        opacity: 0
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .petal {
        animation: none !important;
        display: none
      }
    }

    body {
      margin: 0;
      background: #F6F3EC
    }

    .bp-grid {
      background-image: linear-gradient(rgba(31, 35, 40, .085) 1px, transparent 1px), linear-gradient(90deg, rgba(31, 35, 40, .085) 1px, transparent 1px), linear-gradient(rgba(31, 35, 40, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(31, 35, 40, .035) 1px, transparent 1px);
      background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px
    }

    .bp-plain {
      background-image: none
    }

    a {
      color: #1F2328
    }

    a:hover {
      color: #B23A1C
    }

    .btn-solid:hover {
      background: #B23A1C !important;
      border-color: #B23A1C !important;
      color: #FFFFFF !important
    }

    .btn-line:hover {
      background: rgba(31, 35, 40, .07)
    }

    .row-link:hover {
      background: rgba(31, 35, 40, .05);
      padding-left: 16px !important
    }

    .row-link {
      transition: padding .25s ease, background .25s ease
    }

    .marquee {
      display: flex;
      width: max-content;
      animation: marq 38s linear infinite
    }

    @keyframes marq {
      to {
        transform: translateX(-50%)
      }
    }

    .caret {
      display: inline-block;
      width: 3px;
      height: 1em;
      background: #B23A1C;
      margin-left: 4px;
      vertical-align: -0.12em;
      animation: blink 1s steps(1) infinite
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    .scribble {
      stroke-dasharray: 760;
      stroke-dashoffset: 760;
      animation: scrib 6s ease-in-out infinite
    }

    @keyframes scrib {
      0% {
        stroke-dashoffset: 760
      }

      30%,
      80% {
        stroke-dashoffset: 0
      }

      100% {
        stroke-dashoffset: -760
      }
    }

    .draw {
      stroke-dasharray: 1400;
      stroke-dashoffset: 1400;
      animation: draw 4s ease-out .4s forwards
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0
      }
    }

    .circle-draw {
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      animation: draw2 5s ease-in-out infinite
    }

    @keyframes draw2 {
      0% {
        stroke-dashoffset: 520
      }

      35%,
      85% {
        stroke-dashoffset: 0
      }

      100% {
        stroke-dashoffset: -520
      }
    }

    .sway-a {
      transform-origin: 50% 0;
      animation: swayA 7s ease-in-out infinite
    }

    @keyframes swayA {

      0%,
      100% {
        transform: rotate(3deg)
      }

      50% {
        transform: rotate(1.2deg)
      }
    }

    .sway-b {
      transform-origin: 50% 0;
      animation: swayB 8s ease-in-out infinite
    }

    @keyframes swayB {

      0%,
      100% {
        transform: rotate(-4deg)
      }

      50% {
        transform: rotate(-2deg)
      }
    }

    .sway-c {
      transform-origin: 50% 0;
      animation: swayC 9s ease-in-out infinite
    }

    @keyframes swayC {

      0%,
      100% {
        transform: rotate(2deg)
      }

      50% {
        transform: rotate(3.6deg)
      }
    }

    .float {
      animation: float 5s ease-in-out infinite
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0) rotate(-6deg)
      }

      50% {
        transform: translateY(-8px) rotate(-5deg)
      }
    }

    .eq {
      display: block;
      width: 8px;
      background: #1F2328;
      transform-origin: 50% 100%;
      animation: eq 0.9s ease-in-out infinite alternate
    }

    @keyframes eq {
      0% {
        transform: scaleY(.2)
      }

      100% {
        transform: scaleY(1)
      }
    }

    .pulse {
      animation: pulse 1.6s ease-out infinite
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(178, 58, 28, .55)
      }

      100% {
        box-shadow: 0 0 0 12px rgba(178, 58, 28, 0)
      }
    }

    .sig {
      clip-path: inset(0 100% 0 0);
      animation: sig 2.8s ease-out 1s forwards
    }

    @keyframes sig {
      to {
        clip-path: inset(0 0 0 0)
      }
    }

    .spin-slow {
      animation: spin 40s linear infinite;
      transform-origin: 50% 50%
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .card-lift {
      transition: transform .3s ease, box-shadow .3s ease
    }

    .card-lift:hover {
      transform: translateY(-6px) rotate(-.4deg);
      box-shadow: 8px 10px 0 rgba(31, 35, 40, .12)
    }

    .stretch {
      display: inline-block;
      transform-origin: 0 100%;
      animation: stretch 7s cubic-bezier(.34, 1.56, .64, 1) infinite
    }

    @keyframes stretch {

      0%,
      50% {
        transform: scale(1, 1)
      }

      60%,
      70% {
        transform: scale(1.34, .84)
      }

      78% {
        transform: scale(.95, 1.04)
      }

      84% {
        transform: scale(1.02, .99)
      }

      90%,
      100% {
        transform: scale(1, 1)
      }
    }

    .fix {
      opacity: 0;
      animation: fix 7s ease infinite
    }

    @keyframes fix {

      0%,
      52% {
        opacity: 0;
        transform: translateX(0)
      }

      58%,
      72% {
        opacity: 1;
        transform: translateX(0)
      }

      76% {
        opacity: 1
      }

      82%,
      100% {
        opacity: 0
      }
    }

    .fix-ok {
      opacity: 0;
      animation: fixok 7s ease infinite
    }

    @keyframes fixok {

      0%,
      76% {
        opacity: 0
      }

      80%,
      94% {
        opacity: 1
      }

      100% {
        opacity: 0
      }
    }

    .h-stretch {
      transition: letter-spacing .6s cubic-bezier(.34, 1.56, .64, 1), transform .6s cubic-bezier(.34, 1.56, .64, 1);
      transform-origin: 0 50%
    }

    .h-stretch:hover {
      letter-spacing: 10px;
      transform: scaleY(1.06)
    }

    .rocket {
      position: relative;
      z-index: 30;
      will-change: transform
    }

    .rocket.idle {
      animation: hover 3s ease-in-out infinite
    }

    @keyframes hover {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    .rocket.shake {
      animation: shake .09s linear infinite
    }

    @keyframes shake {
      0% {
        transform: translate(0, 0)
      }

      25% {
        transform: translate(-1.5px, 1px)
      }

      50% {
        transform: translate(1.5px, -1px)
      }

      75% {
        transform: translate(-1px, -1px)
      }

      100% {
        transform: translate(0, 0)
      }
    }

    .rocket.launch {
      transform-origin: 50% 100%;
      animation: fly 2.6s cubic-bezier(.55, 0, .8, .3) forwards
    }

    @keyframes fly {
      0% {
        transform: translateY(0) scale(1, 1)
      }

      8% {
        transform: translateY(8px) scale(1.12, .86)
      }

      18% {
        transform: translateY(-30px) scale(.9, 1.16)
      }

      30% {
        transform: translateY(-160px) scale(.94, 1.1)
      }

      100% {
        transform: translateY(-3200px) scale(.9, 1.22)
      }
    }

    .flame {
      transform-origin: 50% 0;
      animation: flick .12s ease-in-out infinite alternate
    }

    .flame.small {
      transform: scaleY(.35)
    }

    @keyframes flick {
      0% {
        opacity: .85
      }

      100% {
        opacity: 1
      }
    }

    .flame-g {
      transform-origin: 110px 328px;
      transition: transform .4s ease
    }

    .flame-g.small {
      transform: scale(.55, .35)
    }

    .flame-g.big {
      transform: scale(1.1, 1.5)
    }

    .smoke {
      transform-origin: 50% 50%;
      animation: smoke 2.2s ease-out forwards
    }

    @keyframes smoke {
      0% {
        transform: scale(.2);
        opacity: .9
      }

      100% {
        transform: scale(2.4);
        opacity: 0
      }
    }

    .card-front {
      position: relative;
      z-index: 3;
      transition: box-shadow .3s ease
    }

    .card-front:hover {
      box-shadow: 10px 14px 0 rgba(31, 35, 40, .12) !important
    }

    .card-front.out {
      animation: cardOut .52s cubic-bezier(.55, 0, .75, .35) forwards
    }

    @keyframes cardOut {
      0% {
        transform: none;
        opacity: 1
      }

      30% {
        transform: translate(-18px, -10px) rotate(-2deg)
      }

      100% {
        transform: translate(-115%, -60px) rotate(-12deg);
        opacity: 0
      }
    }

    .card-front.in {
      animation: cardIn .62s cubic-bezier(.2, .9, .3, 1.25)
    }

    @keyframes cardIn {
      0% {
        transform: translate(22px, 24px) rotate(1.4deg) scale(.97)
      }

      100% {
        transform: none
      }
    }

    .card-back1 {
      z-index: 2;
      transform: translate(22px, 24px) rotate(1.4deg);
      transition: transform .5s ease
    }

    .card-back2 {
      z-index: 1;
      transform: translate(44px, 46px) rotate(-1.2deg);
      transition: transform .5s ease
    }

    .stack.shift .card-back1 {
      animation: b1 .62s ease
    }

    .stack.shift .card-back2 {
      animation: b2 .62s ease
    }

    @keyframes b1 {
      from {
        transform: translate(44px, 46px) rotate(-1.2deg)
      }

      to {
        transform: translate(22px, 24px) rotate(1.4deg)
      }
    }

    @keyframes b2 {
      from {
        transform: translate(66px, 68px) rotate(2deg);
        opacity: 0
      }

      to {
        transform: translate(44px, 46px) rotate(-1.2deg);
        opacity: 1
      }
    }

    .stack.hold .card-back1 {
      transform: translate(30px, 30px) rotate(2.4deg)
    }

    .stack.hold .card-back2 {
      transform: translate(58px, 58px) rotate(-2.4deg)
    }

    .type-line {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      width: 0;
      animation: typeL 6s steps(20) infinite
    }

    @keyframes typeL {
      0% {
        width: 0
      }

      35%,
      100% {
        width: 20ch
      }
    }

    .type-out {
      opacity: 0;
      animation: typeO 6s steps(1) infinite
    }

    @keyframes typeO {

      0%,
      45% {
        opacity: 0
      }

      46%,
      100% {
        opacity: 1
      }
    }

    .type-ok {
      opacity: 0;
      animation: typeK 6s steps(1) infinite
    }

    @keyframes typeK {

      0%,
      62% {
        opacity: 0
      }

      63%,
      100% {
        opacity: 1
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .card-front.out,
      .card-front.in,
      .stack.shift .card-back1,
      .stack.shift .card-back2,
      .stretch,
      .fix,
      .fix-ok,
      .rocket.idle,
      .marquee,
      .caret,
      .scribble,
      .circle-draw,
      .sway-a,
      .sway-b,
      .sway-c,
      .float,
      .eq,
      .pulse,
      .spin-slow {
        animation: none !important
      }

      .draw,
      .sig {
        animation: none !important;
        stroke-dashoffset: 0;
        clip-path: none
      }
    }

      scroll-behavior: smooth
    }

      svg[style*="bottom: -58px"] {

        height: 96px !important;
        right: -4px !important;
        bottom: -36px !important
      }
    }

    .m-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 22px
    }

    .m-stamp {
      position: absolute;
      right: -6px;
      bottom: -30px;
      width: 96px;
      height: 96px;
      transform: rotate(-12deg);
      opacity: .85;
      pointer-events: none
    }

    .m-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 26px
    }

    .m-stats>div {
      border-top: 1.5px solid #1F2328;
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .m-stats b {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 40px;
      line-height: .9
    }

    .m-stats span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 1px;
      color: rgba(31, 35, 40, .8);
      line-height: 1.35
    }

    /* ============================ phone layout (<900px) ============================ */
    .m-root {
      min-height: 100vh;
      background-color: #F6F3EC;
      color: #1F2328;
      font-family: 'IBM Plex Sans', 'Helvetica Neue', sans-serif;
      overflow-x: clip
    }

    .m-root * {
      box-sizing: border-box
    }

    .m-root img,
    .m-root svg {
      max-width: 100%
    }

    .m-mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px;
      letter-spacing: 1.2px
    }

    .m-hand {
      font-family: 'Caveat', cursive;
      color: #B23A1C;
      font-size: 22px;
      line-height: 1.15
    }

    .m-kicker {
      display: block;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 1.6px;
      color: #B23A1C;
      text-transform: uppercase
    }

    .m-top {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(246, 243, 236, .94);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-bottom: 1.5px solid #1F2328
    }

    .m-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #1F2328;
      min-height: 44px
    }

    .m-brand-t {
      display: flex;
      flex-direction: column;
      line-height: 1.1
    }

    .m-brand-t b {
      font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 1.5px
    }

    .m-brand-t small {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: rgba(31, 35, 40, .75)
    }

    .m-burger {
      width: 46px;
      height: 46px;
      border: 1.5px solid #1F2328;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      padding: 0
    }

    .m-burger span {
      display: block;
      width: 20px;
      height: 2px;
      background: #1F2328;
      transition: transform .3s ease, opacity .3s ease
    }

    .m-burger.x span:nth-child(1) {
      transform: translateY(7px) rotate(45deg)
    }

    .m-burger.x span:nth-child(2) {
      opacity: 0
    }

    .m-burger.x span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg)
    }

    .m-drawer {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: #F6F3EC;
      background-image: linear-gradient(rgba(31, 35, 40, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(31, 35, 40, .06) 1px, transparent 1px);
      background-size: 24px 24px;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 28px;
      transform: translateY(-102%);
      transition: transform .4s cubic-bezier(.2, .9, .3, 1);
      visibility: hidden
    }

    .m-drawer.open {
      transform: none;
      visibility: visible
    }

    .m-drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 46px;
      border-bottom: 1.5px solid #1F2328;
      padding-bottom: 12px
    }

    .m-x {
      width: 46px;
      height: 46px;
      border: 1.5px solid #1F2328;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      color: #1F2328
    }

    .m-drawer-links {
      display: flex;
      flex-direction: column;
      margin-top: 10px
    }

    .m-drawer-links a {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(31, 35, 40, .25);
      text-decoration: none;
      color: #1F2328;
      font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
      font-weight: 900;
      font-size: 46px;
      line-height: 1
    }

    .m-drawer-links a.on {
      color: #B23A1C
    }

    .m-no {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: #B23A1C;
      letter-spacing: 1px
    }

    .m-drawer-foot {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .m-ticker {
      overflow: hidden;
      background: #1F2328;
      color: #F6F3EC;
      font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 2.5px
    }

    .m-ticker .marquee {
      padding: 9px 0
    }

    .m-ticker .marquee>div {
      display: flex;
      gap: 26px;
      padding-right: 26px;
      white-space: nowrap
    }

    .m-sec {
      position: relative;
      padding: 40px 16px;
      border-bottom: 1px solid rgba(31, 35, 40, .3)
    }

    .m-sech {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px
    }

    .m-badge {
      flex: 0 0 auto;
      width: 50px;
      height: 50px;
      border: 1.5px solid #1F2328;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1
    }

    .m-badge b {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 19px
    }

    .m-badge i {
      font-style: normal;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: #B23A1C;
      margin-top: 3px;
      padding-top: 3px;
      border-top: 1px solid #1F2328;
      width: 34px;
      text-align: center
    }

    .m-h2 {
      margin: 0 0 4px;
      font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
      font-weight: 900;
      font-size: 40px;
      line-height: .92;
      letter-spacing: .5px
    }

    .m-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 54px;
      padding: 0 20px;
      border: 1.5px solid #1F2328;
      background: transparent;
      color: #1F2328;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      cursor: pointer;
      width: 100%
    }

    .m-btn.solid {
      background: #1F2328;
      color: #FFFFFF
    }

    .m-btn:active {
      transform: translateY(1px)
    }

    .m-card {
      border: 1.5px solid #1F2328;
      background: #F6F3EC;
      box-shadow: 4px 6px 0 rgba(31, 35, 40, .08)
    }

    .m-hscroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 6px 16px 22px;
      margin: 0 -16px;
      scrollbar-width: none
    }

    .m-hscroll::-webkit-scrollbar {
      display: none
    }

    .m-hscroll>* {
      scroll-snap-align: center;
      flex: 0 0 86%
    }

    .m-swipe {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px
    }

    /* hero */
    .m-hero {
      padding-top: 26px
    }

    .m-name {
      margin: 14px 0 0;
      display: flex;
      flex-direction: column;
      font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
      font-weight: 900;
      font-size: clamp(88px, 30vw, 140px);
      line-height: .84;
      letter-spacing: -1px
    }

    .m-name .o {
      color: transparent;
      -webkit-text-stroke: 2px #1F2328
    }

    .m-typed {
      margin: 26px 0 0;
      font-size: 27px;
      font-weight: 600;
      line-height: 1.2;
      min-height: 68px
    }

    .m-typed .m-hand {
      font-size: 36px;
      font-weight: 700
    }

    .m-lead {
      margin: 14px 0 0;
      font-size: 18px;
      line-height: 1.55;
      color: rgba(31, 35, 40, .88)
    }

    .m-clockline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px
    }

    .m-dot {
      display: block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #B23A1C
    }

    .m-fig {
      margin: 30px 0 0
    }

    .m-tb {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1.5px solid #1F2328;
      margin-top: 18px;
      font-family: 'JetBrains Mono', monospace;
      background: #F6F3EC
    }

    .m-tb>div {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-bottom: 1px solid rgba(31, 35, 40, .4)
    }

    .m-tb>div:nth-child(odd) {
      border-right: 1px solid rgba(31, 35, 40, .4)
    }

    .m-tb>div:nth-last-child(-n+2) {
      border-bottom: none
    }

    .m-tb span {
      font-size: 9.5px;
      letter-spacing: 1.4px;
      color: rgba(31, 35, 40, .72)
    }

    .m-tb b {
      font-size: 13px
    }

    /* spec */
    .m-p1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.4;
      font-weight: 500
    }

    .m-p2 {
      margin: 14px 0 0;
      font-size: 16px;
      line-height: 1.65;
      color: rgba(31, 35, 40, .88)
    }

    .m-spec {
      margin-top: 22px;
      border: 1.5px solid #1F2328;
      background: #F6F3EC
    }

    .m-spec>div {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 4px 10px;
      padding: 12px 12px;
      border-bottom: 1px solid rgba(31, 35, 40, .25)
    }

    .m-spec>div:last-child {
      border-bottom: none
    }

    .m-spec .n {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #B23A1C;
      grid-row: span 2
    }

    .m-spec .k {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.4px;
      font-weight: 700
    }

    .m-spec .v {
      font-size: 15px;
      line-height: 1.4
    }

    /* system */
    .m-layer {
      border: 1.5px solid #1F2328;
      background: #F6F3EC;
      padding: 16px
    }

    .m-layer h3 {
      margin: 4px 0 12px;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 28px;
      line-height: 1
    }

    .m-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .m-chips span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 8px 11px;
      border: 1px solid rgba(31, 35, 40, .55)
    }

    .m-link {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 46px;
      padding-left: 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.4px;
      color: rgba(31, 35, 40, .8)
    }

    .m-owner {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    /* drawings */
    .m-proj {
      display: flex;
      flex-direction: column;
      border: 1.5px solid #1F2328;
      background: #F6F3EC;
      box-shadow: 5px 7px 0 rgba(31, 35, 40, .08)
    }

    .m-proj-h {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 11px 14px;
      border-bottom: 1px solid rgba(31, 35, 40, .5);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.3px
    }

    .m-proj-b {
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1
    }

    .m-proj-b h3 {
      margin: 0;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 36px;
      line-height: .95
    }

    .m-proj-b p {
      margin: 0;
      font-size: 15px;
      line-height: 1.55
    }

    .m-pts {
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(31, 35, 40, .35)
    }

    .m-pts div {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(31, 35, 40, .2);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px
    }

    .m-proj-fig {
      padding: 4px 12px 14px;
      display: flex;
      justify-content: center
    }

    .m-proj-f {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1.5px solid #1F2328;
      font-family: 'JetBrains Mono', monospace
    }

    .m-proj-f div {
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px
    }

    .m-proj-f div:first-child {
      border-right: 1px solid rgba(31, 35, 40, .4)
    }

    .m-proj-f span {
      font-size: 9.5px;
      letter-spacing: 1.3px;
      color: rgba(31, 35, 40, .72)
    }

    .m-proj-f b {
      font-size: 12px
    }

    /* timeline */
    /* off duty */
    .m-notes>* {
      flex: 0 0 72%
    }

    .m-notes .sway-a,
    .m-notes .sway-b,
    .m-notes .sway-c {
      margin-top: 18px !important
    }

    .m-letter {
      margin-top: 10px
    }

    .m-letter>div {
      transform: none !important;
      padding: 28px 22px 24px !important
    }

    .m-letter .float {
      position: relative !important;
      left: auto !important;
      right: auto !important;
      top: auto !important;
      margin: 0 auto 18px;
      z-index: 1
    }

    .m-letter .sway-a {
      position: relative !important;
      left: auto !important;
      bottom: auto !important;
      margin: 18px 0 0 6px
    }

    .m-letter p {
      font-size: 25px !important;
      line-height: 34px !important
    }

    /* transmit */
    .m-fuji {
      display: flex;
      justify-content: flex-end;
      margin: -6px 0 8px
    }

    .m-h1b {
      margin: 0;
      font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
      font-weight: 900;
      font-size: clamp(56px, 17vw, 92px);
      line-height: .88;
      display: flex;
      flex-direction: column
    }

    .m-h1b .o {
      color: transparent;
      -webkit-text-stroke: 2px #1F2328
    }

    .m-rows {
      display: flex;
      flex-direction: column;
      border-top: 1px solid rgba(31, 35, 40, .5);
      margin-top: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      letter-spacing: 1px
    }

    .m-rows a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 54px;
      padding: 0 4px;
      border-bottom: 1px solid rgba(31, 35, 40, .5);
      text-decoration: none;
      color: #1F2328
    }

    /* launch */
    .m-launch {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .m-pad {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      height: 300px;
      border-bottom: 2px solid #1F2328;
      background-image: repeating-linear-gradient(45deg, transparent 0 7px, rgba(31, 35, 40, .08) 7px 8px);
      background-size: 100% 18px;
      background-repeat: no-repeat;
      background-position: bottom;
      position: relative
    }

    .m-pad .rocket {
      width: 150px !important;
      height: 300px !important
    }

    .m-pad .rocket>svg {
      width: 150px;
      height: 300px
    }

    .m-pad>svg {
      height: 270px;
      width: auto
    }

    .m-cd {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1.5px solid #1F2328;
      font-family: 'JetBrains Mono', monospace
    }

    .m-cd div {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .m-cd div:first-child {
      border-right: 1px solid rgba(31, 35, 40, .5)
    }

    .m-cd span {
      font-size: 9.5px;
      letter-spacing: 1.4px;
      color: rgba(31, 35, 40, .72)
    }

    .m-cd b {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 34px;
      line-height: 1
    }

    /* footer */
    .m-foot {
      position: relative;
      margin-top: 0
    }

    .m-seig {
      position: relative;
      height: 36px;
      overflow: hidden
    }

    .m-foot-in {
      padding: 16px 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1.5px solid #1F2328
    }

    .m-foot-in b {
      display: block;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 28px;
      line-height: 1
    }

    .m-foot-row {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    /* sheets */
    .m-scrim {
      position: fixed;
      inset: 0;
      z-index: 69;
      background: rgba(31, 35, 40, .38);
      border: none;
      padding: 0;
      width: 100%;
      cursor: pointer;
      animation: fadeIn .25s ease
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .m-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 70;
      max-height: 86vh;
      overflow-y: auto;
      background: #F6F3EC;
      border-top: 2px solid #1F2328;
      border-radius: 14px 14px 0 0;
      padding: 10px 16px 26px;
      box-shadow: 0 -12px 40px rgba(31, 35, 40, .3);
      animation: sheetUp .35s cubic-bezier(.2, .9, .3, 1)
    }

    @keyframes sheetUp {
      from {
        transform: translateY(60px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .m-grab {
      display: block;
      width: 44px;
      height: 5px;
      border-radius: 3px;
      background: rgba(31, 35, 40, .3);
      margin: 0 auto 14px
    }

    .m-sheet .story-in,
    .m-sheet .panel-in {
      transform: none !important;
      box-shadow: none !important;
      border: none !important;
      padding: 0 !important;
      background: transparent !important;
      animation: none !important;
      position: static !important
    }

    .m-sheet .story-in>span:first-child,
    .m-sheet .panel-in>span:first-child {
      display: none
    }

    /* photos */
    .m-film {
      overflow: hidden;
      background: #1F2328;
      padding: 6px 0
    }

    .m-pgrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 12px
    }

    .m-photo {
      position: relative;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      text-align: left;
      color: #1F2328;
      font: inherit
    }

    .m-photo .c {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 8px 10px;
      background: #FFFFFF;
      border: 1px solid rgba(31, 35, 40, .15);
      box-shadow: 3px 6px 0 rgba(31, 35, 40, .12);
      transition: transform .3s ease
    }

    .m-photo:active .c {
      transform: scale(.97)
    }

    .m-photo .t {
      position: absolute;
      top: -8px;
      left: 50%;
      width: 54px;
      height: 17px;
      margin-left: -27px;
      background: rgba(214, 204, 176, .85);
      transform: rotate(-4deg);
      z-index: 1
    }

    .m-photo .i {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1/1.05;
      background-size: cover;
      background-position: center;
      border: 1px dashed rgba(31, 35, 40, .45);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px
    }

    .m-photo .cap {

    .m-neg section {

      outline: 1.5px solid #1F2328;
      box-shadow: inset 0 0 0 1.5px #1F2328, 5px 8px 0 rgba(31, 35, 40, .12);
      padding: 16px 10px 8px

    .m-board .peg-item {

    }

      margin-bottom: 6px
    }

      justify-content: space-between;
      align-items: flex-end;
      margin-top: 8px
    }

    .m-shelf .phones,
    .m-shelf .plant {
      zoom: .72
    }

    .m-sheet iframe {
      display: block;
      width: 100%
    }

    /* blog */
    .m-chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 16px 8px;
      margin: 0 -16px;
      scrollbar-width: none
    }

    .m-chips-row::-webkit-scrollbar {
      display: none
    }

    .m-chips-row .chip {
      flex: 0 0 auto
    }

    .m-feat {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px 18px
    }

    .m-feat h3 {
      margin: 0;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 40px;
      line-height: .92
    }

    .m-feat p {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      color: rgba(31, 35, 40, .9)
    }

    .m-post {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 18px 2px;
      border-bottom: 1px solid rgba(31, 35, 40, .3);
      text-decoration: none;
      color: #1F2328
    }

    .m-post b {
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 28px;
      line-height: 1
    }

    .m-post span.x {
      font-size: 15px;
      line-height: 1.5;
      color: rgba(31, 35, 40, .85)
    }

    .m-post .meta {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.2px;
      color: #B23A1C

    @media (prefers-reduced-motion: reduce) {
      .m-drawer {
        transition: none
      }

      border: 1.5px solid #1F2328;
      background: #F6F3EC;
      padding: 12px 12px 10px;
      margin: 0 0 30px;
      position: relative;
      box-shadow: 6px 6px 0 rgba(31, 35, 40, .08)
    }

    .m-prof:before,
    .m-prof:after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border: 1.5px solid #B23A1C
    }

    .m-prof:before {
      left: -6px;
      top: -6px;
      border-right: 0;
      border-bottom: 0
    }

    .m-prof:after {
      right: -6px;
      bottom: -6px;
      border-left: 0;
      border-top: 0
    }

    .m-prof-h,
    .m-prof-f {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      letter-spacing: 1px;
      color: rgba(31, 35, 40, .75)
    }

    .m-prof-h {
      padding-bottom: 8px;
      border-bottom: 1px dashed rgba(31, 35, 40, .3);
      margin-bottom: 10px
    }

    .m-prof-f {
      padding-top: 8px;
      border-top: 1px dashed rgba(31, 35, 40, .3);
      margin-top: 4px
    }

    .m-prof-h .live {
      color: #B23A1C;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px
    }

    .m-prof-h .live i,
    .m-nowtag i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #B23A1C;
      animation: mBlink 1.2s steps(2) infinite
    }

    @keyframes mBlink {
      50% {
        opacity: .15
      }
    }

    .m-prof-phase {
      display: block;
      width: 100%;
      height: auto;
      max-width: 300px;
      margin: 0 0 4px
    }

    .m-prof-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible
    }

    .m-tl {
      position: relative;
      padding-left: 46px;
      --p: 0
    }

    .m-tl-rail {
      position: absolute;
      left: 12px;
      top: 44px;
      bottom: 40px;
      width: 18px;
      background: repeating-linear-gradient(to bottom, rgba(31, 35, 40, .55) 0 1px, transparent 1px 14px) left/6px 100% no-repeat
    }

    .m-tl-rail:before {
      content: '';
      position: absolute;
      left: 8px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: repeating-linear-gradient(#1F2328 0 6px, transparent 6px 10px);
      opacity: .55
    }

    .m-tl-fill {
      position: absolute;
      left: 8px;
      top: 0;
      width: 2px;
      height: calc(var(--p) * 100%);
      background: #B23A1C;
      box-shadow: 0 0 6px rgba(178, 58, 28, .5)
    }

    .m-tl-climber {
      position: absolute;
      left: 2px;
      top: calc(var(--p) * 100%);
      width: 14px;
      height: 14px;
      margin-top: -7px;
      border-radius: 50%;
      background: #B23A1C;
      border: 2px solid #F6F3EC;
      box-shadow: 0 0 0 4px rgba(178, 58, 28, .22), 0 0 16px 5px rgba(178, 58, 28, .38);
      animation: mGlow 1.4s ease-in-out infinite;
      z-index: 3
    }

    @keyframes mGlow {
      50% {
        box-shadow: 0 0 0 7px rgba(178, 58, 28, .12), 0 0 22px 8px rgba(178, 58, 28, .3)
      }
    }

    .m-tl-yr {
      position: absolute;
      left: 50%;
      bottom: 17px;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: .5px;
      color: #F6F3EC;
      background: #B23A1C;
      padding: 2px 4px;
      white-space: nowrap;
      font-size: 9px
    }

    .m-tl-yr:before {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -4px;
      margin-left: -4px;
      border: 4px solid transparent;
      border-bottom: 0;
      border-top-color: #B23A1C
    }

    .m-st {
      position: relative;
      margin-bottom: 18px
    }

    .m-node {
      position: absolute;
      left: -36px;
      top: 20px;
      width: 14px;
      height: 14px;
      border: 2px solid #1F2328;
      background: #F6F3EC;
      border-radius: 50%;
      transition: background .4s, border-color .4s;
      z-index: 2
    }

    .m-node:after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 1.5px solid #B23A1C;
      opacity: 0
    }

    .m-st.in .m-node {
      background: #1F2328
    }

    .m-st.in .m-node:after {
      animation: mRipple 1.1s ease-out .15s 2
    }

    .m-st.now .m-node {
      background: #B23A1C;
      border-color: #B23A1C
    }

    .m-st.now.in .m-node:after {
      animation: mRipple 1.6s ease-out infinite
    }

    @keyframes mRipple {
      0% {
        transform: scale(1);
        opacity: .9
      }

      100% {
        transform: scale(3.2);
        opacity: 0
      }
    }

    .m-st .m-card {
      padding: 16px;
      position: relative
    }

    .m-st .m-card:before {
      content: '';
      position: absolute;
      left: -14px;
      top: 26px;
      width: 13px;
      border-top: 1.5px dashed rgba(31, 35, 40, .55)
    }

    .m-st-h {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px
    }

    .m-el {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .6px;
      color: #B23A1C;
      white-space: nowrap
    }

    .m-st h3 {
      margin: 6px 0 4px;
      font-family: 'Big Shoulders Display', sans-serif;
      font-weight: 900;
      font-size: 26px;
      line-height: 1
    }

    .m-st .org {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px
    }

    .m-st p {
      margin: 8px 0 0;
      font-size: 15px;
      line-height: 1.55;
      color: rgba(31, 35, 40, .88)
    }

    .m-elbar {
      margin-top: 12px;
      height: 8px;
      border: 1px solid rgba(31, 35, 40, .5);
      position: relative;
      overflow: hidden
    }

    .m-elbar i {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: calc(var(--e) * 100%);
      background: repeating-linear-gradient(45deg, rgba(31, 35, 40, .55) 0 1.5px, transparent 1.5px 5px);
      border-right: 2px solid #B23A1C;
      transform-origin: left;
      transition: transform 1.1s cubic-bezier(.2, .8, .2, 1) .25s
    }

    .m-st.now .m-elbar i {
      background: repeating-linear-gradient(45deg, rgba(178, 58, 28, .7) 0 1.5px, transparent 1.5px 5px)
    }

    .m-nowtag {
      position: absolute;
      right: 12px;
      top: -11px;
      background: #F6F3EC;
      border: 1.5px solid #B23A1C;
      color: #B23A1C;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 3px 7px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      animation: mBob 2s ease-in-out infinite
    }

    @keyframes mBob {
      50% {
        transform: translateY(-3px)
      }
    }

    .m-born {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 22px -46px;
      padding-left: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 1.4px
    }

    .m-born svg {
      flex: none;
      position: relative;
      z-index: 2;
      background: #F6F3EC
    }

    .m-brk {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: -2px 0 18px -46px
    }

    .m-brk .zz {
      flex: none;
      margin-left: 4px;
      position: relative;
      z-index: 2
    }

    .m-brk .m-hand {
      font-size: 19px
    }

    .m-tl-end {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      margin-left: -40px;
      padding-top: 2px
    }

    .m-tl-end .m-hand {
      font-size: 22px
    }

    .js-log .m-tl .m-st:not(.m-born):not(.m-brk) {
      opacity: 0;
      transform: translateX(26px);
      transition: opacity .7s ease, transform .7s cubic-bezier(.2, .8, .2, 1)
    }

    .js-log .m-tl .m-brk {
      opacity: 0;
      transition: opacity .8s
    }

    .js-log .m-tl .m-st.in:not(.m-born) {
      opacity: 1;
      transform: none
    }

    .js-log .m-elbar i {
      transform: scaleX(0)
    }

    .js-log .m-st.in .m-elbar i {
      transform: scaleX(1)
    }

    @media (prefers-reduced-motion: reduce) {

      .m-tl-climber,
      .m-nowtag,
      .m-prof-h .live i {
        animation: none
      }

      .js-log .m-tl .m-st {
        transition: none
      }
    }
  </style>
</head>
